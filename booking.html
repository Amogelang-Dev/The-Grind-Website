<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Booking | THE GRIND.</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .booking-container {
            min-height: 80vh;
            background: #050505;
            color: white;
            padding: 80px 10%;
            display: flex;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
        }

        .booking-card {
            width: 100%;
            max-width: 600px;
            background: #0a0a0a;
            padding: 40px;
            border: 1px solid #111;
            border-radius: 12px;
        }

        .plan-summary {
            background: #111;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid var(--gold, #C4A484);
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; 
            font-size: 0.7rem; 
            color: var(--gold, #C4A484); 
            text-transform: uppercase; 
            margin-bottom: 8px; 
            letter-spacing: 1px; 
        }

        .form-group input, .form-group select { 
            width: 100%; 
            background: #000; 
            border: 1px solid #222; 
            padding: 12px; 
            color: white; 
            border-radius: 5px; 
            outline: none; 
        }

        .form-group input:focus { border-color: var(--gold, #C4A484); }

        .confirm-btn { 
            background: var(--gold, #C4A484); 
            color: #000; 
            border: none; 
            padding: 15px; 
            font-weight: 900; 
            text-transform: uppercase; 
            cursor: pointer; 
            width: 100%; 
            border-radius: 5px; 
            margin-top: 10px;
        }
    </style>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>

    <div id="header-container"></div>

    <div class="booking-container">
        <div class="booking-card">
            <h2 style="margin-bottom: 10px;">Complete Your Booking</h2>
            <p style="color: #666; margin-bottom: 30px;">Send a workspace booking request. No payment is taken on this demo site.</p>

            <div class="plan-summary">
                <p style="font-size: 0.7rem; text-transform: uppercase; color: #888;">Selected Plan</p>
                <h3 style="margin: 5px 0;" id="planName">Standard Day Pass</h3>
                <p style="font-weight: 900; color: var(--gold, #C4A484);" id="planPrice">R150</p>
            </div>

            <div id="errorMsg" style="display: none; color: #ff4444; background: rgba(255,0,0,0.1); padding: 10px; border-radius: 5px; margin-bottom: 20px; font-size: 0.8rem;"></div>

            <form id="bookingForm">
                <input type="hidden" name="plan_type" id="planInput" value="daypass">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="email@example.com">
                </div>

                <div class="form-group">
                    <label>Booking Date</label>
                    <input type="date" id="booking_date" name="booking_date" required>
                </div>

                <div class="form-group" id="seatingGroup">
                    <label>Seating Preference</label>
                    <select name="seating">
                        <option value="focus-booth">Focus Booth</option>
                        <option value="standing-desk">Standing Desk</option>
                        <option value="communal">Communal Table</option>
                    </select>
                </div>

                <button type="submit" class="confirm-btn">Submit Booking Request</button>
            </form>
        </div>
    </div>

    <div id="footer-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const plan = urlParams.get('plan') === 'fullstack' ? 'fullstack' : 'daypass';
            
            const planName = plan === 'fullstack' ? 'Full Stack Monthly' : 'Standard Day Pass';
            const price = plan === 'fullstack' ? 'R2500' : 'R150';

            document.getElementById('planName').innerText = planName;
            document.getElementById('planPrice').innerText = price;
            document.getElementById('planInput').value = plan;

            if (plan !== 'daypass') {
                document.getElementById('seatingGroup').style.display = 'none';
            }

            // Set default date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('booking_date').min = today;
            document.getElementById('booking_date').value = today;

            // Pre-fill user data if stored
            const user = JSON.parse(localStorage.getItem('user_session') || '{}');
            if (user.user_name) document.getElementById('name').value = user.user_name;
            if (user.user_email) document.getElementById('email').value = user.user_email;

            // Display stored error message if present
            const err = localStorage.getItem('error_msg');
            if (err) {
                const errContainer = document.getElementById('errorMsg');
                errContainer.innerText = err;
                errContainer.style.display = 'block';
                localStorage.removeItem('error_msg');
            }
        });

        document.getElementById('bookingForm').addEventListener('submit', event => {
            event.preventDefault();
            const booking = {
                id: `BOOK-${Date.now()}`,
                plan: document.getElementById('planInput').value,
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                date: document.getElementById('booking_date').value,
                seating: document.querySelector('[name="seating"]').value,
                status: 'Request received',
                created_at: new Date().toISOString()
            };
            const bookings = JSON.parse(localStorage.getItem('workspace_bookings') || '[]');
            localStorage.setItem('workspace_bookings', JSON.stringify([booking, ...bookings]));
            localStorage.setItem('booking_success', `Your ${booking.plan === 'fullstack' ? 'Full Stack Monthly' : 'Day Pass'} request (${booking.id}) is saved in this browser demo. The team must confirm availability separately.`);
            window.location.href = `booking-success.html?ref=${encodeURIComponent(booking.id)}`;
        });
    </script>
    <script src="nav.js"></script>
</body>
</html>

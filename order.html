<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Order - The Grind</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .order-container {
            max-width: 600px;
            margin: 60px auto;
            padding: 40px;
            background: var(--gray-dark, #0a0a0a);
            border: 1px solid var(--gray-medium, #111);
            text-align: center;
        }

        .order-summary {
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .item-name { font-size: 1.5rem; color: var(--gold, #C4A484); font-weight: 700; }
        .item-price { font-size: 1.2rem; color: #fff; margin-top: 10px; }

        .payment-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }

        /* Custom Radio Buttons */
        .pay-opt {
            border: 1px solid #333;
            padding: 20px;
            cursor: pointer;
            transition: var(--transition, all 0.3s ease);
            border-radius: 4px;
        }

        .pay-opt:hover { border-color: var(--gold, #C4A484); }

        input[type="radio"] { display: none; }

        input[type="radio"]:checked + .pay-opt {
            background: var(--gold, #C4A484);
            color: black;
            border-color: var(--gold, #C4A484);
        }

        .pay-opt i { font-size: 1.5rem; display: block; margin-bottom: 10px; }

        /* Card Input Fields Container */
        .card-fields-container {
            display: none;
            text-align: left;
            margin-bottom: 20px;
            border: 1px solid #333;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        .form-group {
            text-align: left; 
            margin-bottom: 20px;
        }

        .form-group label {
            color: var(--gold, #C4A484); 
            font-size: 0.7rem; 
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%; 
            padding: 15px; 
            background: #000; 
            border: 1px solid #333; 
            color: white;
            box-sizing: border-box;
        }

        .card-expiry-cvv {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .note { font-size: 0.8rem; color: #888; margin-top: 20px; font-style: italic; }
    </style>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>

    <section class="order-container">
        <div class="order-summary">
            <h2 class="gold-text">Confirm Order</h2>
            <p class="item-name" id="item-display">Select an Item</p>
            <p class="item-price" id="price-display">Total: R 0.00</p>
        </div>

        <form id="order-form">
            <p style="text-align: left; font-size: 0.8rem; color: var(--gold, #C4A484); text-transform: uppercase; letter-spacing: 1px;">Select Payment Method</p>
            
            <div class="payment-options">
                <label>
                    <input type="radio" name="payment_method" value="Card" id="pay-card" required>
                    <div class="pay-opt">
                        <i class="fas fa-credit-card"></i>
                        <span>Card at the counter</span>
                    </div>
                </label>
                
                <label>
                    <input type="radio" name="payment_method" value="Cash" id="pay-cash" required>
                    <div class="pay-opt">
                        <i class="fas fa-money-bill-wave"></i>
                        <span>Cash at the counter</span>
                    </div>
                </label>
            </div>

            <div class="form-group">
                <label>Your Name (For the Queue)</label>
                <input type="text" id="customer_name" name="customer_name" placeholder="Enter your name" required>
            </div>

            <button type="submit" class="btn btn-gold" style="width: 100%;">Place Order & Join Queue</button>
            <p class="note">Demo checkout: payment is collected at the counter. No card details are taken online.</p>
        </form>
    </section>

    <script src="store.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const itemName = urlParams.get('item');
        const product = GrindStore.getProducts().find(entry =>
            productId ? String(entry.id) === productId : entry.name === itemName
        );
        const submitButton = document.querySelector('#order-form button[type="submit"]');

        if (localStorage.getItem('store_status') === 'CLOSED') {
            document.getElementById('item-display').innerText = 'Store closed';
            document.getElementById('price-display').innerText = 'Online ordering is temporarily unavailable.';
            submitButton.disabled = true;
        } else if (product) {
            document.getElementById('item-display').innerText = product.name;
            document.getElementById('price-display').innerText = `Total: ${GrindStore.formatPrice(product.price)}`;
        } else {
            document.getElementById('item-display').innerText = 'Item unavailable';
            document.getElementById('price-display').innerText = 'Please return to the menu and choose an available item.';
            submitButton.disabled = true;
        }

        document.getElementById('order-form').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!product || localStorage.getItem('store_status') === 'CLOSED') return;
            const customerName = document.getElementById('customer_name').value.trim();
            const paymentMethod = document.querySelector('input[name="payment_method"]:checked')?.value;
            if (!customerName || !paymentMethod) return;
            const order = GrindStore.createOrder({ customerName, product, paymentMethod });
            const currentTime = new Date(order.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const activeOrder = {
                id: order.id,
                number: order.id,
                name: order.customer_name,
                item: order.item_name,
                time: currentTime,
                status: order.status
            };
            localStorage.setItem('active_order', JSON.stringify(activeOrder));
            window.location.href = 'queue-ticket.html';
        });
    </script>
</body>
</html>
